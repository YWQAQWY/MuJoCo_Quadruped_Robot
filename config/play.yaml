# ================= 回放与视频配置 =================
seed: 0
deterministic: true
add_noise: false
randomize: false
command_override: true
duration: 20.0
fps: 50
viewer_log_every_steps: 50
viewer_close_poll_seconds: 0.01
viewer_close_grace_seconds: 0.05

keyboard:
  linear_step: 0.2          # 单次W即可超过0.15 m/s步态启动阈值
  lateral_step: 0.2
  yaw_step: 0.2
  print_commands: true      # 每次有效按键立即在终端打印指令
  max_vx: 0.3           # stage2 只训练 0.2–0.3 m/s，键盘钳位在训练范围内
  max_vy: 0.6
  max_yaw_rate: 1.0
  keys:
    forward: up             # ↑ 前进
    backward: down          # ↓ 后退（stage3 训练后可用）
    yaw_left: left          # ← 左转（stage3 训练后可用）
    yaw_right: right        # → 右转（stage3 训练后可用）
    left: q                 # Q/E 横移（stage4 训练后可用）
    right: e
    stop: space
    reset: r

video:
  width: 640
  height: 480
  codec: libx264
  camera: track
  mujoco_gl: egl

# [持续时间(s), [vx, vy, yaw_rate]]
command_script:
  - [2.0, [0.0, 0.0, 0.0]]
  - [4.0, [0.8, 0.0, 0.0]]
  - [4.0, [0.5, 0.4, 0.0]]
  - [4.0, [0.0, 0.0, 0.8]]
  - [4.0, [0.5, 0.0, 0.0]]
  - [2.0, [0.0, 0.0, 0.0]]
