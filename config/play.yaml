# ================= 回放与视频配置 =================
seed: 0
deterministic: true
add_noise: false
randomize: false
command_override: true
duration: 20.0
fps: 50
viewer_log_every_steps: 50
viewer_close_poll_seconds: 0.01
viewer_close_grace_seconds: 0.05

keyboard:
  linear_step: 0.1          # 每次按键改变线速度 (m/s)
  yaw_step: 0.1             # 每次按键改变角速度 (rad/s)
  max_vx: 1.0
  max_vy: 0.6
  max_yaw_rate: 1.0
  keys:
    forward: w
    backward: s
    left: a
    right: d
    yaw_left: q
    yaw_right: e
    stop: space
    reset: r

video:
  width: 640
  height: 480
  codec: libx264
  camera: track
  mujoco_gl: egl

# [持续时间(s), [vx, vy, yaw_rate]]
command_script:
  - [2.0, [0.0, 0.0, 0.0]]
  - [4.0, [0.8, 0.0, 0.0]]
  - [4.0, [0.5, 0.4, 0.0]]
  - [4.0, [0.0, 0.0, 0.8]]
  - [4.0, [0.5, 0.0, 0.0]]
  - [2.0, [0.0, 0.0, 0.0]]
