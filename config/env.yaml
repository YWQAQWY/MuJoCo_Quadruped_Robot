# ================= 环境配置 =================

simulation:
  decimation: 4               # 控制频率 = 模拟频率(200 Hz) / decimation = 50 Hz
  episode_length: 1000        # 回合长度（控制步数），1000 步 × 0.02 s = 20 s

gait:
  phase_frequency: 1.5        # 初期采用较低步态时钟频率 (Hz)
  randomize_initial_phase: false
  leg_phase_offsets: [0.0, 0.5, 0.5, 0.0] # FL/RR 与 FR/RL 相差半周期
  duty_factor: 0.58
  phase_smoothing: 0.035      # 平滑接触相边界（周期比例）
  contact_force_threshold: 2.0 # 法向力达到该值才进入接触 (N)
  contact_force_release_threshold: 1.0 # 已接触脚低于该值才释放，形成滞回
  contact_force_normalization: 25.0
  air_time_target: 0.2        # 期望摆动腿腾空时间 (s)
  swing_foot_height: 0.055    # 摆动相脚端最低目标高度 (m)
  residual_control:
    enabled: false            # 默认关闭；stage2_forward 中开启
    scale: 0.2                # PPO 残差占 pd.action_scale 的比例
  reference:
    enabled: false            # 默认关闭，避免影响 stage1/旧模型
    nominal_speed: 0.3
    minimum_speed_scale: 0.45
    maximum_speed_scale: 1.25
    minimum_lift_scale: 0.9
    maximum_lift_scale: 1.0
    joint_amplitudes: [0.0, -0.20, 0.10] # abduction/hip_pitch/knee (rad)
    joint_biases: [0.0, 0.0, 0.0]
    swing_knee_lift: 0.32     # 摆动腿额外屈膝量 (rad)
    phase_bias: 0.0
    abduction_leg_signs: [1.0, -1.0, 1.0, -1.0]

commands:                     # 速度指令（机体坐标系，策略要跟踪的目标）
  resample_steps: 500         # 每 500 控制步（10 s）重采样一次指令
  stand_still_prob: 0.1       # 课程开始时的静止指令概率
  stand_still_prob_final: 0.1 # 课程结束后的静止指令概率
  curriculum_start_ranges:    # 初期只学习简单前进
    vx: [0.0, 0.5]
    vy: [0.0, 0.0]
    yaw_rate: [0.0, 0.0]
  ranges:                     # 指令均匀采样范围
    vx: [-1.0, 1.0]           #   前进速度 (m/s)
    vy: [-0.6, 0.6]           #   侧移速度 (m/s)
    yaw_rate: [-1.0, 1.0]     #   偏航角速度 (rad/s)

observation:
  scales:                     # 固定缩放：把不同量纲的观测量压到相近尺度再喂给策略
    base_lin_vel: 2.0         #   基座线速度 (m/s)，用于形成速度闭环
    base_ang_vel: 0.25        #   基座角速度 (rad/s)
    projected_gravity: 1.0    #   投影重力（无单位，已在 ±1 内）
    commands: [2.0, 2.0, 0.25]  # 指令 vx, vy, yaw_rate
    dof_pos: 1.0              #   关节角 − 默认姿态 (rad)
    dof_vel: 0.05             #   关节角速度 (rad/s)
    actions: 1.0              #   上一步动作
    phase: 1.0                #   sin/cos gait phase
    foot_contacts: 1.0        #   四足接触状态
    heading: 1.0              #   航向误差 sin/cos（相对回合初始航向）
    yaw_ema: 2.0              #   低通滤波偏航率 (rad/s)
  noise:                      # 观测噪声（高斯，只加在观测上、不污染真实状态）
    base_lin_vel: 0.1         #   标准差 (m/s)
    base_ang_vel: 0.2         #   标准差 (rad/s)
    projected_gravity: 0.05   #   标准差
    dof_pos: 0.01             #   标准差 (rad)
    dof_vel: 1.5              #   标准差 (rad/s)

rewards:
  lin_tracking_sigma: 0.15    # 线速度跟踪高斯核宽度
  ang_tracking_sigma: 0.15    # 角速度跟踪高斯核宽度
  base_height_sigma: 10.0     # 高度奖励系数：exp(-(h−h*)² · 10)
  joint_limit_margin: 0.1     # 限位软边界：距关节限位 10% 量程内开始惩罚
  stand_command_threshold: 0.1
  moving_command_threshold: 0.15
  stationary_velocity_threshold: 0.1
  straight_yaw_threshold: 0.05 # 低于该偏航指令时启用直线航向保持
  yaw_drift_alpha: 0.02       # 偏航率低通滤波系数（τ≈1 s，只保留漂移、滤掉步态振荡）
  weights:                    # 各项奖励权重，总奖励 = Σ(weight × 项)
    lin_vel: 2.0              #   线速度跟踪 exp(−‖v_cmd − v_xy‖² / sigma)
    ang_vel: 1.0              #   角速度跟踪 exp(−(ω_cmd − ω_z)² / sigma)
    vel_z: -2.0               #   惩罚垂直速度 v_z²（保持高度平稳）
    ang_xy: -0.05             #   惩罚横滚/俯仰角速度 ω_x² + ω_y²（保持姿态平稳）
    lateral_velocity: -1.0    #   直行阶段抑制横向速度
    straight_heading: -5.0    #   相对回合初始航向的平方惩罚，防止走弧线
    yaw_drift: -5.0           #   低通偏航率线性惩罚（小漂移也有梯度，不误伤步态振荡）
    base_height: 0.05         #   奖励保持标称高度 exp(−(h−h*)²·sigma)
    orientation: -0.2         #   惩罚基座倾斜（投影重力水平分量平方和）
    action_rate: -0.002       #   初期减弱运动惩罚，允许形成步态
    torque: -2.0e-6
    dof_acc: -5.0e-8
    joint_limit: -10.0        #   关节限位惩罚（超出软边界部分的平方和）
    power: -2.0e-6            #   机械功率惩罚 Σ|τ·qdot|
    feet_slip: -0.01          #   足端接触地面时的水平滑移速度平方
    undesired_contact: -0.5   #   小腿/大腿等非足端部件触地次数
    stand_pose: -0.2          #   静止指令下偏离默认关节姿态的平方
    no_motion: -0.5           #   非零移动指令下仍近乎静止
    speed_error: -2.0         #   前进速度对称误差惩罚，超速与欠速同样受罚
    gait_contact: 0.3         #   对角 trot 目标接触模式匹配
    foot_clearance: 20.0      #   摆动脚低于目标高度的平方惩罚
    landing_velocity: 0.02    #   落脚瞬间向下速度平方惩罚
    feet_air_time: 0.2        #   移动指令下合理腾空后的落足奖励
    termination: -100.0       #   摔倒终止的额外惩罚

termination:                  # 任一条件满足即判定摔倒、回合终止
  max_roll: 0.5               #   |roll| 上限 (rad)
  max_pitch: 0.7              #   |pitch| 上限 (rad)
  torso_contact: true         #   躯干触地

domain_randomization:         # 训练时开启的随机化（评估/回放时关闭）
  friction_range: [0.5, 1.25] #   每回合足端摩擦系数均匀采样范围
  mass_scale_range: [0.9, 1.1] #   刚体质量和惯量缩放
  pd_gain_scale_range: [0.9, 1.1] # PD 增益缩放
  action_delay_steps: [0, 2]  #   随机动作延迟（控制步）
  push:
    probability: 0.1          #     每次指令重采样时随机推一把的概率
    velocity_range: [-1.0, 1.0]  #  推搡速度脉冲范围 (m/s)，施加在基座水平方向
  init:
    pos_range: [-0.5, 0.5]    #     初始 x,y 位置范围 (m)
    z_noise: 0.005            #     初始高度扰动 ±(m)
    rpy_noise: 0.15           #     初始姿态扰动 ±(rad)
    dof_pos_noise: 0.05       #     初始关节角扰动 ±(rad)
    base_height_offset: 0.01  #     默认高度之上的初始化偏移 (m)
